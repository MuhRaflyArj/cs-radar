[project]
name = "cs-radar"
version = "0.1.0"
description = "Research assistant for tracking growing LLM research topics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2,<5",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
major_version_zero = true

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]
